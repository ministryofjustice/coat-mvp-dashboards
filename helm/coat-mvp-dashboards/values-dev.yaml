app:
  ingress:
    primaryHost: "coat-mvp-dashboards-dev.cloud-platform.service.justice.gov.uk"

  service:
    port: 80
    targetPort: 8501

  deployment:
    env:
      APP_ENV: "development"
      COH_REPORT_S3_URI: "s3://cloud-platform-4e74939a04d400578bfbe3f3f707b07e/coh-reports-manual/COH-recommendations-2026-09-23-sort-by-value-excl-RIs-SPs.csv"

    dashboards:
      coh_dashboard:
        name: "coh-dashboard"
        replicaCount: 1
        serviceAccountName: "mvp-dashboards-sa"
        image:
          repository: ""
          tag: ""

      showback_report:
        name: "showback-report"
        replicaCount: 1
        serviceAccountName: "mvp-dashboards-sa"
        image:
          repository: ""
          tag: ""
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
          limits:
            cpu: "2"
            memory: "8Gi"
        env:
          ATHENA_REGION: ""
          ATHENA_ROLE: ""
          ATHENA_OUTPUT_LOCATION: ""
          ATHENA_WORKGROUP: ""

          ATHENA_CACHE_TTL_SECONDS: 3024000
          ATHENA_CACHE_DATABASE: "cloud_optimisation_datamarts"
          ATHENA_CACHE_QUERY: "SELECT * FROM fct_net_unblended_cost_categorised;"

          REDIS_HOST: ""
          REDIS_PASSWORD: ""
          REDIS_PORT: ""
