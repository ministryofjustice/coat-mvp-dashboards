name: showback-preload-cache

image:
  repository: ""
  tag: ""

cron:
  schedule: "0 6 1 * *"
  timeZone: "Etc/UTC"
  suspend: false

serviceAccountName: "mvp-dashboards-sa"

resources:
  requests:
    cpu: "1"
    memory: "4Gi"
  limits:
    cpu: "1"
    memory: "4Gi"

env:
  ATHENA_REGION: ""
  ATHENA_ROLE: ""
  ATHENA_OUTPUT_LOCATION: ""
  ATHENA_WORKGROUP: ""

  ATHENA_CACHE_TTL_SECONDS: "3024000"
  ATHENA_CACHE_MAX_PARQUET_BYTES: "67108864"
  ATHENA_CACHE_DATABASE: "cloud_optimisation_derived_dev_dbt.fct_monthly_showback_cost"
  ATHENA_CACHE_QUERY: | 
    select
      billing_period,
      cost_category_service_area,
      business_unit,
      account_name,
      tag_namespace,
      tag_service_area,
      product_name,
      is_taggable_product,
      spend_usd,
      usage_cost_usd,
      tagged_service_area_usage_cost_usd,
      tagged_business_unit_usage_cost_usd,
      tagged_application_usage_cost_usd,
      tagged_owner_usage_cost_usd,
      tagged_is_production_usage_cost_usd,
      tagged_environment_name_usage_cost_usd,
      tagged_namespace_usage_cost_usd
    from cloud_optimisation_derived_dev_dbt.fct_monthly_showback_cost
    where cost_category_service_area = 'Hosting'
    and billing_period <= date_format(date_add('month', -1, current_date), '%Y-%m')
    order by billing_period, business_unit, account_name;

  REDIS_HOST: ""
  REDIS_PASSWORD: ""
  REDIS_PORT: ""