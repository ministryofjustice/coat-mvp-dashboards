name: showback-preload-cache

image:
  repository: ""
  tag: ""

cron:
  schedule: "0 6 1 * *"
  timeZone: "Etc/UTC"
  suspend: false

serviceAccountName: "mvp-dashboards-sa"

resources:
  requests:
    cpu: "1"
    memory: "4Gi"
  limits:
    cpu: "1"
    memory: "4Gi"

env:
  ATHENA_REGION: ""
  ATHENA_ROLE: ""
  ATHENA_OUTPUT_LOCATION: ""
  ATHENA_WORKGROUP: ""

  ATHENA_CACHE_TTL_SECONDS: "3024000"
  ATHENA_CACHE_MAX_PARQUET_BYTES: "67108864"
  ATHENA_CACHE_DATABASE: "cloud_optimisation_datamarts"
  ATHENA_CACHE_QUERY: "SELECT * FROM fct_net_unblended_cost_categorised;"

  REDIS_HOST: ""
  REDIS_PASSWORD: ""
  REDIS_PORT: ""