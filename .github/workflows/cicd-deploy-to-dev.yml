name: "♻️ Deploy to Development Namespace"

on:
  workflow_dispatch:
  push:
    branches: [main]
env:
  # A majority of the secrets generated here come from the cloud-platform-environments repository.
  KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}
  KUBE_NAMESPACE: ${{ secrets.DEV_KUBE_NAMESPACE }}
  KUBE_CERT: ${{ secrets.DEV_KUBE_CERT }}
  KUBE_TOKEN: ${{ secrets.DEV_KUBE_TOKEN }}

  IMAGE_TAG: ${{ github.sha }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY_URL }}
  ECR_REPOSITORY: ${{ vars.DEV_MVP_DASHBOARDS_ECR_REPOSITORY }}

  AUTH0_CLIENT_ID: ${{ secrets.DEV_AUTH0_APP_CLIENT_ID }}
  AUTH0_CLIENT_SECRET: ${{ secrets.DEV_AUTH0_APP_CLIENT_SECRET }}
  AUTH0_DOMAIN: ${{ secrets.DEV_AUTH0_DOMAIN }}

  ATHENA_REGION: ${{ secrets.ATHENA_REGION }}
  ATHENA_ROLE: ${{ secrets.ATHENA_ROLE }}
  ATHENA_OUTPUT_LOCATION: ${{ secrets.ATHENA_OUTPUT_LOCATION }}
  ATHENA_WORKGROUP: ${{ secrets.ATHENA_WORKGROUP }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dashboard: [coh_dashboard, showback_report]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4.0.2
        with:
          role-to-assume: ${{ secrets.DEV_MVP_DASHBOARDS_ECR_ROLE_TO_ASSUME }}
          aws-region: "eu-west-2"

      - uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076  # v2.0.1
        id: login-ecr
      - run: |
          docker build --build-arg DASHBOARD=${{ matrix.dashboard }} -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG-${{ matrix.dashboard }} .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG-${{ matrix.dashboard }}

  deploy-to-dev:
    needs: build-push
    runs-on: ubuntu-latest
    container: alpine/k8s:1.23.17
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to the cluster
        run: |
          echo "${KUBE_CERT}" > ca.crt
          kubectl config set-cluster ${KUBE_CLUSTER} --certificate-authority=./ca.crt --server=https://${KUBE_CLUSTER}
          kubectl config set-credentials deploy-user --token=${KUBE_TOKEN}
          kubectl config set-context ${KUBE_CLUSTER} --cluster=${KUBE_CLUSTER} --user=deploy-user --namespace=${KUBE_NAMESPACE}
          kubectl config get-contexts
          kubectl config use-context ${KUBE_CLUSTER}

      - name: Deploy helm chart to dev
        run: |
          helm upgrade coat-mvp-dashboards \
            helm/coat-mvp-dashboards \
            --install \
            --force \
            --wait \
            --timeout 10m \
            --namespace ${KUBE_NAMESPACE} \
            --values=helm/coat-mvp-dashboards/values-dev.yaml \
            --set app.deployment.dashboards.coh_dashboard.image.repository=${ECR_REGISTRY}/${ECR_REPOSITORY} \
            --set app.deployment.dashboards.coh_dashboard.image.tag=${IMAGE_TAG}-coh_dashboard \
            --set app.deployment.dashboards.showback_report.image.repository=${ECR_REGISTRY}/${ECR_REPOSITORY} \
            --set app.deployment.dashboards.showback_report.image.tag=${IMAGE_TAG}-showback_report \
            --set app.deployment.dashboards.showback_report.env.ATHENA_REGION="${ATHENA_REGION}" \
            --set app.deployment.dashboards.showback_report.env.ATHENA_ROLE="${ATHENA_ROLE}" \
            --set app.deployment.dashboards.showback_report.env.ATHENA_OUTPUT_LOCATION="${ATHENA_OUTPUT_LOCATION}" \
            --set app.deployment.dashboards.showback_report.env.ATHENA_WORKGROUP="${ATHENA_WORKGROUP}" \
            --set app.deployment.env.AUTH0_DOMAIN="${AUTH0_DOMAIN}" \
            --set app.deployment.env.AUTH0_CLIENT_ID="${AUTH0_CLIENT_ID}" \
            --set app.deployment.env.AUTH0_CLIENT_SECRET="${AUTH0_CLIENT_SECRET}"
